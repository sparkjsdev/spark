name: Spark CI Browser
on:
  push:
    branches:
      - main
      # TODO: remove before merging; temporary so the workflow runs on this branch.
      - fix-paged-lod-browser-test
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Add Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --locked

      - name: Build spark-rs
        run: npm run build:wasm

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test/browser/playwright-report/
          retention-days: 14
