<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • 4DGS (experimental)</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #ui {
      position: absolute; left: 12px; top: 12px; z-index: 10; color: #fff;
      font: 13px/1.4 sans-serif; background: rgba(0, 0, 0, 0.55);
      padding: 8px 10px; border-radius: 6px; max-width: 360px;
    }
    #buffer {
      position: absolute; left: 50%; top: 45%; transform: translateX(-50%); z-index: 10; display: none;
      color: #fff; font: 16px/1.4 sans-serif; background: rgba(0, 0, 0, 0.65); padding: 10px 16px; border-radius: 8px;
    }
    #status { margin-top: 4px; opacity: 0.85; white-space: pre-line; font-family: monospace; font-size: 11px; }
  </style>
</head>

<body>
  <div id="buffer"></div>
  <div id="ui">
    <div>Select one or more 4D compressed PLY files (e.g. <code>00.c.ply</code> ... <code>09.c.ply</code>):</div>
    <input type="file" id="file" accept=".ply" multiple />
    <div id="status">No file loaded. You can also use <code>?url=...</code></div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "../../dist/spark.module.js",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import GUI from "lil-gui";
    import { VRButton } from "three/addons/webxr/VRButton.js";
    import { SparkRenderer, SplatMesh, dyno } from "@sparkjsdev/spark";
    import { getAssetFileURL } from "../js/get-asset-url.js";

    // ------------------------------------------------------------------
    // Experimental 4DGS playback.
    //
    // A "4D compressed PLY" is a SuperSplat compressed PLY that has two extra
    // per-splat fields: `packed_motion` (velocity) and `packed_time` (time
    // center + temporal scale), plus matching min/max values in each chunk.
    // Spark already decodes position/rotation/scale/color from such a file
    // (and ignores the 4D fields). Here we decode the 4D fields ourselves
    // into float textures and animate every splat on the GPU through a Dyno
    // objectModifier:
    //   center(t) = center + velocity * (t - t0)
    //   alpha(t)  = alpha * exp(-0.5 * ((t - t0) / sigma)^2)
    // The exact bit layout of packed_time is not known yet, so the layout
    // can be switched in the GUI while we verify it visually.
    // ------------------------------------------------------------------

    const SPLAT_TEX_WIDTH = 2048;
    const SPLAT_TEX_HEIGHT = 2048;

    // ---- BEGIN parse4dPly ----
    function parse4dPly(buf) {
      const bytes = new Uint8Array(buf);
      const tag = "end_header\n";
      let hEnd = -1;
      const head = new TextDecoder("ascii").decode(bytes.subarray(0, Math.min(bytes.length, 16384)));
      const idx = head.indexOf(tag);
      if (idx < 0) throw new Error("PLY header not found");
      hEnd = idx + tag.length;

      const elements = [];
      for (const line of head.slice(0, hEnd).split("\n")) {
        const p = line.trim().split(/\s+/);
        if (p[0] === "element") elements.push({ name: p[1], count: Number(p[2]), props: {}, size: 0 });
        if (p[0] === "property") {
          const el = elements[elements.length - 1];
          el.props[p[2]] = el.size;
          el.size += 4; // float / uint32 only in this format
        }
      }
      const chunkEl = elements.find((e) => e.name === "chunk");
      const vertEl = elements.find((e) => e.name === "vertex");
      if (!chunkEl || !vertEl || !("packed_motion" in vertEl.props) || !("packed_time" in vertEl.props)) {
        throw new Error("Not a 4D compressed PLY (missing chunk/packed_motion/packed_time)");
      }
      const dv = new DataView(buf);
      const chunkStart = hEnd;
      const vertStart = chunkStart + chunkEl.count * chunkEl.size;

      const chunks = new Array(chunkEl.count);
      const keys = ["min_time", "max_time", "min_time_scale", "max_time_scale",
        "min_motion_x", "max_motion_x", "min_motion_y", "max_motion_y", "min_motion_z", "max_motion_z"];
      let tMin = Infinity, tMax = -Infinity;
      for (let c = 0; c < chunkEl.count; c++) {
        const o = chunkStart + c * chunkEl.size;
        const ch = {};
        for (const k of keys) ch[k] = dv.getFloat32(o + chunkEl.props[k], true);
        chunks[c] = ch;
        tMin = Math.min(tMin, ch.min_time);
        tMax = Math.max(tMax, ch.max_time);
      }
      return {
        numSplats: vertEl.count, chunks, tMin, tMax, dv, vertStart,
        recordSize: vertEl.size,
        motionOffset: vertEl.props.packed_motion,
        timeOffset: vertEl.props.packed_time,
      };
    }

    // Decodes the 4D fields into two RGBA32F arrays laid out like Spark's splat textures.
    //   A = (vx, vy, vz, t0)    B = (timeScale, 0, 0, 0)
    function decode4d(info, layout, A, B) {
      const { numSplats, chunks, dv, vertStart, recordSize, motionOffset, timeOffset } = info;
      for (let i = 0; i < numSplats; i++) {
        const ch = chunks[i >> 8]; // SuperSplat chunks hold 256 splats
        const base = vertStart + i * recordSize;
        const m = dv.getUint32(base + motionOffset, true);
        const p = dv.getUint32(base + timeOffset, true);

        const fx = ((m >>> 21) & 2047) / 2047;
        const fy = ((m >>> 11) & 1023) / 1023;
        const fz = (m & 2047) / 2047;

        let ft, fs;
        if (layout === 0) { // time = bits 31..21 (11 bit), scale = bits 20..11 (10 bit)
          ft = (p >>> 21) / 2047;
          fs = ((p >>> 11) & 1023) / 1023;
        } else { // scale = bits 31..21 (11 bit), time = bits 20..11 (10 bit)
          fs = (p >>> 21) / 2047;
          ft = ((p >>> 11) & 1023) / 1023;
        }

        const o = i * 4;
        A[o] = ch.min_motion_x + fx * (ch.max_motion_x - ch.min_motion_x);
        A[o + 1] = ch.min_motion_y + fy * (ch.max_motion_y - ch.min_motion_y);
        A[o + 2] = ch.min_motion_z + fz * (ch.max_motion_z - ch.min_motion_z);
        A[o + 3] = ch.min_time + ft * (ch.max_time - ch.min_time);
        B[o] = ch.min_time_scale + fs * (ch.max_time_scale - ch.min_time_scale);
      }
    }

    // Percentiles of the decoded time centers and temporal scales (sampled),
    // used to pick a sensible default time and to debug the packed layout.
    function computeStats(info, A, B) {
      const step = Math.max(1, Math.floor(info.numSplats / 50000));
      const t0 = [], ls = [];
      for (let i = 0; i < info.numSplats; i += step) { t0.push(A[i * 4 + 3]); ls.push(B[i * 4]); }
      t0.sort((a, b) => a - b); ls.sort((a, b) => a - b);
      const q = (arr, f) => arr[Math.min(arr.length - 1, Math.floor(f * arr.length))];
      const pts = [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99];
      return {
        t0: pts.map((f) => q(t0, f)),
        ls: pts.map((f) => q(ls, f)),
      };
    }
    // ---- END parse4dPly ----

    function makeDataTexture(numSplats) {
      const width = SPLAT_TEX_WIDTH;
      const height = Math.max(1, Math.min(SPLAT_TEX_HEIGHT, Math.ceil(numSplats / width)));
      const depth = Math.ceil(numSplats / (width * height));
      const array = new Float32Array(width * height * depth * 4);
      const texture = new THREE.DataArrayTexture(array, width, height, depth);
      texture.format = THREE.RGBAFormat;
      texture.type = THREE.FloatType;
      texture.internalFormat = "RGBA32F";
      texture.minFilter = THREE.NearestFilter;
      texture.magFilter = THREE.NearestFilter;
      texture.needsUpdate = true;
      return { texture, array };
    }

    // ---- Scene ----
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(0, 1.5, 2);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    renderer.xr.enabled = true;
    document.body.appendChild(VRButton.createButton(renderer));
    // In VR the viewer stands at the origin, so push the scene away from the head.
    renderer.xr.addEventListener("sessionstart", () => scene.position.set(0, -0.9, -1.2));
    renderer.xr.addEventListener("sessionend", () => scene.position.set(0, 0, 0));
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.8, 0);
    controls.update();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---- Dyno uniforms (shared by all batches; only the shown batch is updated) ----
    const uTime = dyno.dynoFloat(0); // time relative to the start of the shown batch
    const uMotionScale = dyno.dynoFloat(1);
    const uFade = dyno.dynoFloat(1);
    const uScaleMode = dyno.dynoInt(0);
    const uMinAlpha = dyno.dynoFloat(0.01);
    const uSigmaScale = dyno.dynoFloat(1);
    const uDebug = dyno.dynoInt(0);
    const uDbgLo = dyno.dynoFloat(0);
    const uDbgHi = dyno.dynoFloat(5);
    const uCamLocal = dyno.dynoVec3(new THREE.Vector3()); // camera position in the mesh's local space
    const uSizeWeight = dyno.dynoFloat(1);

    const params = {
      time: 0, play: true, speed: 1, loop: true,
      segLen: 5, // length of one batch (.c.ply file) in time units
      layout: 1, scaleMode: 0, sigmaLog: 0, debug: 0,
      motionScale: 1, fade: true, minAlpha: 0.01, flipY: false,
      budgetOn: false, budget: 200, // budget in thousands of visible splats
      sizeWeight: true,
      vrScale: 1, foveation: 1,
    };

    // URL options (the GUI is not reachable inside a headset):
    //   ?budget=200      keep at most ~200k splats visible (raises the opacity threshold automatically)
    //   ?vrscale=0.8     VR framebuffer scale (set before entering VR)
    //   ?foveation=1     fixed foveated rendering 0..1
    const qp = new URLSearchParams(location.search);
    if (qp.has("budget")) { params.budgetOn = true; params.budget = Number(qp.get("budget")); }
    if (qp.has("size")) params.sizeWeight = qp.get("size") !== "0"; // ?size=0 disables size/distance weighting
    if (qp.has("seglen")) params.segLen = Number(qp.get("seglen")); // length of one .c.ply file in time units
    uSizeWeight.value = params.sizeWeight ? 1 : 0;
    if (qp.has("vrscale")) params.vrScale = Number(qp.get("vrscale"));
    if (qp.has("foveation")) params.foveation = Number(qp.get("foveation"));
    renderer.xr.setFramebufferScaleFactor(params.vrScale);
    renderer.xr.setFoveation(params.foveation);

    const statusEl = document.getElementById("status");
    const bufEl = document.getElementById("buffer");
    let files = []; // File objects sorted by name: 00.c.ply, 01.c.ply, ...
    let batches = []; // per file: { state, mesh, texA, texB, info, arrays }
    let shown = -1; // index of the batch currently visible
    let buffering = false; // true while playback waits for a download
    let timeCtl = null;
    const totalTime = () => Math.max(1, files.length) * params.segLen;

    function buildModifier(samplerA, samplerB) {
      return dyno.dynoBlock(
        { gsplat: dyno.Gsplat },
        { gsplat: dyno.Gsplat },
        ({ gsplat }) => {
          const { index } = dyno.splitGsplat(gsplat).outputs;
          const coord = dyno.splatTexCoord(index);
          const a = dyno.texelFetch(samplerA, coord); // (vx, vy, vz, t0)
          const b = dyno.texelFetch(samplerB, coord); // (ln timeScale, ...)

          const d = new dyno.Dyno({
            inTypes: {
              gsplat: dyno.Gsplat, a: "vec4", b: "vec4", t: "float",
              motionScale: "float", fade: "float", scaleMode: "int", minAlpha: "float", sigmaScale: "float",
              debug: "int", dbgLo: "float", dbgHi: "float", camPos: "vec3", sizeWeight: "float",
            },
            outTypes: { gsplat: dyno.Gsplat },
            statements: ({ inputs, outputs }) => dyno.unindentLines(/* glsl */ `
              ${outputs.gsplat} = ${inputs.gsplat};
              float lnS = ${inputs.b}.x;
              float sigma = (${inputs.scaleMode} == 0) ? exp(lnS)
                          : ((${inputs.scaleMode} == 1) ? lnS : exp(-lnS));
              sigma = max(sigma * ${inputs.sigmaScale}, 1e-4);
              float dt = ${inputs.t} - ${inputs.a}.w;
              if (${inputs.debug} == 1) {
                // Debug: color by decoded time center t0 (no filtering).
                float h = clamp((${inputs.a}.w - ${inputs.dbgLo}) / max(${inputs.dbgHi} - ${inputs.dbgLo}, 1e-4), 0.0, 1.0) * 0.8;
                ${outputs.gsplat}.rgba.rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
              } else if (${inputs.debug} == 2) {
                // Debug: color by decoded log temporal scale (no filtering).
                float h = clamp((lnS + 5.0) / 8.0, 0.0, 1.0) * 0.8;
                ${outputs.gsplat}.rgba.rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
              } else if (${inputs.debug} == 0) {
                ${outputs.gsplat}.center += ${inputs.a}.xyz * dt * ${inputs.motionScale};
                float w = exp(-0.5 * (dt * dt) / (sigma * sigma));
                float alpha = ${inputs.gsplat}.rgba.a * mix(1.0, w, ${inputs.fade});
                ${outputs.gsplat}.rgba.a = alpha;
                // Importance = opacity, optionally scaled by apparent size (size / distance).
                // Small or far-away splats are dropped first when the budget is tight.
                float sz = max(max(${inputs.gsplat}.scales.x, ${inputs.gsplat}.scales.y), ${inputs.gsplat}.scales.z);
                float dist = max(distance(${outputs.gsplat}.center, ${inputs.camPos}), 0.05);
                float sizeF = clamp((sz / dist) / 0.003, 0.0, 1.0);
                float importance = alpha * mix(1.0, sizeF, ${inputs.sizeWeight});
                if (importance < ${inputs.minAlpha}) {
                  ${outputs.gsplat}.flags = 0u;
                }
              }
              // debug == 3: pass-through, exactly what plain Spark shows.
            `),
          });

          return {
            gsplat: d.apply({
              gsplat, a, b, t: uTime, motionScale: uMotionScale,
              fade: uFade, scaleMode: uScaleMode, minAlpha: uMinAlpha, sigmaScale: uSigmaScale,
              debug: uDebug, dbgLo: uDbgLo, dbgHi: uDbgHi, camPos: uCamLocal, sizeWeight: uSizeWeight,
            }).gsplat,
          };
        },
      );
    }

    const setFlip = (m) => m.quaternion.set(params.flipY ? 1 : 0, 0, 0, params.flipY ? 0 : 1);

    // Loads one batch. The mesh is added to the scene hidden: Spark skips invisible meshes.
    async function loadBatch(i) {
      const b = (batches[i] = { state: "loading" });
      try {
        const file = files[i];
        const buf = await file.arrayBuffer((got, total) => { b.got = got; b.total = total; });
        const info = parse4dPly(buf);
        const A = makeDataTexture(info.numSplats);
        const B = makeDataTexture(info.numSplats);
        decode4d(info, params.layout, A.array, B.array);
        A.texture.needsUpdate = true;
        B.texture.needsUpdate = true;
        // Same keys for every batch: identical shader source lets three.js reuse the
        // compiled program, so later batches don't trigger a shader compile (lag spike).
        const samplerA = new dyno.DynoSampler2DArray({ value: A.texture, key: "fourDMotionTime" });
        const samplerB = new dyno.DynoSampler2DArray({ value: B.texture, key: "fourDTimeScale" });

        // Spark may transfer the buffer to a worker, so give it its own copy.
        const mesh = new SplatMesh({ fileBytes: buf.slice(0), fileName: file.name });
        mesh.objectModifier = buildModifier(samplerA, samplerB);
        mesh.visible = false;
        setFlip(mesh);
        scene.add(mesh);
        await mesh.initialized;
        mesh.updateGenerator();
        Object.assign(b, {
          info, mesh, texA: A.texture, texB: B.texture, arrays: { A: A.array, B: B.array }, state: "ready",
        });
        if (i === 0) console.log("4DGS stats (batch 0)", computeStats(info, A.array, B.array));
      } catch (err) {
        b.state = "error";
        b.failedAt = performance.now();
        console.error(err);
        statusEl.textContent = `Error in ${files[i].name}: ${err.message}`;
      }
    }

    function unloadBatch(i) {
      const b = batches[i];
      if (!b || b.state !== "ready") return;
      scene.remove(b.mesh);
      b.mesh.dispose?.();
      b.texA.dispose();
      b.texB.dispose();
      batches[i] = undefined;
    }

    // Keeps the batch for the current time (and the next one) loaded, drops the rest.
    function manageBatches() {
      const n = files.length;
      if (n === 0) return;
      const T = params.time;
      const cur = Math.min(n - 1, Math.max(0, Math.floor(T / params.segLen)));
      const local = T - cur * params.segLen;
      const next = cur + 1 < n ? cur + 1 : (params.loop ? 0 : -1);
      const want = new Set([cur]);
      // Download the next batch only after the current one is ready, so the two never fight for bandwidth.
      if (next >= 0 && next !== cur && batches[cur]?.state === "ready") want.add(next);
      for (const i of want) {
        if (batches[i]?.state === "error" && performance.now() - batches[i].failedAt > 3000) batches[i] = undefined; // retry
      }

      for (const i of want) if (!batches[i]) loadBatch(i);
      for (let i = 0; i < n; i++) {
        if (!want.has(i) && i !== shown) unloadBatch(i);
      }
      // Switch to the current batch as soon as it is ready; until then keep the old one.
      if (batches[cur]?.state === "ready" && shown !== cur) {
        const old = shown;
        if (old >= 0 && batches[old]?.mesh) batches[old].mesh.visible = false;
        batches[cur].mesh.visible = true;
        shown = cur;
        uDbgHi.value = params.segLen;
        if (old >= 0 && old !== cur && !want.has(old)) unloadBatch(old);
      }
    }

    function redecodeAll() {
      for (const b of batches) {
        if (!b || b.state !== "ready") continue;
        decode4d(b.info, params.layout, b.arrays.A, b.arrays.B);
        b.texA.needsUpdate = true;
        b.texB.needsUpdate = true;
        b.mesh.updateVersion();
      }
    }

    function setFiles(list) {
      for (let i = 0; i < batches.length; i++) unloadBatch(i);
      batches = [];
      shown = -1;
      files = [...list].sort((x, y) => x.name.localeCompare(y.name, undefined, { numeric: true }));
      params.time = 0;
      if (timeCtl) timeCtl.max(totalTime()).updateDisplay();
    }

    // ---- GUI ----
    const gui = new GUI({ title: "4DGS" });
    timeCtl = gui.add(params, "time", 0, 5, 0.001).name("time (global)").listen();
    gui.add(params, "play");
    gui.add(params, "loop");
    gui.add(params, "speed", 0, 10, 0.01).name("speed (units/s)");
    gui.add(params, "segLen", 0.5, 20, 0.01).name("batch length")
      .onChange(() => timeCtl.max(totalTime()).updateDisplay());
    gui.add(params, "layout", { "scale=hi11, time=mid10 (verified)": 1, "time=hi11, scale=mid10": 0 })
      .name("packed_time layout").onChange(redecodeAll);
    gui.add(params, "scaleMode", { "sigma = exp(scale)": 0, "sigma = raw scale": 1, "sigma = exp(-scale)": 2 })
      .name("temporal scale").onChange((v) => { uScaleMode.value = Number(v); });
    gui.add(params, "debug", {
      "off (normal playback)": 0, "color by time t0": 1,
      "color by temporal scale": 2, "no effect (plain Spark)": 3,
    }).name("DEBUG view").onChange((v) => { uDebug.value = Number(v); });
    gui.add(params, "sigmaLog", -2, 2, 0.01).name("sigma scale (10^x)")
      .onChange((v) => { uSigmaScale.value = 10 ** v; });
    gui.add(params, "motionScale", 0, 5, 0.01).name("motion scale")
      .onChange((v) => { uMotionScale.value = v; });
    gui.add(params, "fade").name("temporal opacity").onChange((v) => { uFade.value = v ? 1 : 0; });
    gui.add(params, "minAlpha", 0, 1, 0.001).name("min alpha").listen()
      .onChange((v) => { uMinAlpha.value = v; });
    gui.add(params, "budgetOn").name("auto budget");
    gui.add(params, "budget", 20, 1500, 10).name("budget (k splats)");
    gui.add(params, "sizeWeight").name("weigh by size/distance")
      .onChange((v) => { uSizeWeight.value = v ? 1 : 0; });
    gui.add(params, "flipY").name("flip upside down").onChange(() => {
      for (const b of batches) if (b?.mesh) setFlip(b.mesh);
    });

    // ---- Loading ----
    document.getElementById("file").addEventListener("change", (e) => {
      if (e.target.files.length) setFiles(e.target.files);
    });
    // ?url=file.c.ply            -> a single batch
    // ?base=./data/&count=10     -> ./data/00.c.ply ... ./data/09.c.ply (handy on a headset)
    const query = new URLSearchParams(location.search);
    // Downloads with progress, uses the HTTP cache (files never change) and retries on failure.
    const remoteFile = (url) => ({
      name: url.split("/").pop(),
      arrayBuffer: async (onProgress) => {
        let lastErr;
        for (let attempt = 0; attempt < 4; attempt++) {
          try {
            const res = await fetch(url, { cache: "force-cache" });
            if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
            const total = Number(res.headers.get("content-length")) || 0; // 0 if the server hides it (CORS)
            const reader = res.body.getReader();
            const parts = [];
            let got = 0;
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              parts.push(value);
              got += value.length;
              onProgress?.(got, total);
            }
            const out = new Uint8Array(got);
            let o = 0;
            for (const part of parts) { out.set(part, o); o += part.length; }
            return out.buffer;
          } catch (err) {
            lastErr = err;
            await new Promise((r) => setTimeout(r, 1000 * 2 ** attempt));
          }
        }
        throw lastErr;
      },
    });
    if (query.get("url")) {
      setFiles([remoteFile(query.get("url"))]);
    } else if (query.get("base")) {
      const n = Number(query.get("count") || 10);
      const base = query.get("base");
      setFiles(Array.from({ length: n }, (_, i) => remoteFile(`${base}${String(i).padStart(2, "0")}.c.ply`)));
    } else {
      loadDefault();
    }

    // No URL options: load the sample clip listed in examples/assets.json (cat-00.c.ply, cat-01.c.ply, ...).
    async function loadDefault() {
      try {
        const res = await fetch("../assets.json");
        const assets = await res.json();
        const names = Object.keys(assets).filter((k) => /^cat-\d+\.c\.ply$/.test(k)).sort();
        if (!names.length) throw new Error("no cat-*.c.ply entries in assets.json");
        const urls = await Promise.all(names.map((n) => getAssetFileURL(n)));
        setFiles(urls.map(remoteFile));
      } catch (err) {
        statusEl.textContent = `No sample files (${err.message}). Select files above, or use ?base=...`;
      }
    }

    // ---- Render loop ----
    let last = performance.now();
    let lastStatus = 0;
    const camTmp = new THREE.Vector3();
    let frames = 0;
    let sortsSeen = 0;
    let lastSortStamp = 0;

    // Estimates how many splats are visible at the current time (sampled, so it is cheap).
    function estimateActive() {
      const b = batches[shown];
      if (!b || b.state !== "ready") return null;
      const A = b.arrays.A, B = b.arrays.B, n = b.info.numSplats;
      const stride = 8, t = uTime.value, k = 10 ** params.sigmaLog;
      let c = 0, total = 0;
      for (let i = 0; i < n; i += stride) {
        const sigma = Math.max(Math.exp(B[i * 4]) * k, 1e-4);
        const x = (t - A[i * 4 + 3]) / sigma;
        if (Math.exp(-0.5 * x * x) >= params.minAlpha) c++;
        total++;
      }
      return { active: Math.round((c / total) * n), n };
    }
    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      frames++;
      if (spark.lastSortTime !== lastSortStamp) { lastSortStamp = spark.lastSortTime; sortsSeen++; }
      if (files.length) {
        manageBatches();
        buffering = false;
        if (params.play) {
          // The clock only runs while the data for the current time is loaded.
          const n = files.length;
          const ready = (i) => batches[i]?.state === "ready";
          const cur = Math.min(n - 1, Math.max(0, Math.floor(params.time / params.segLen)));
          let t = params.time + dt * params.speed;
          let target = Math.min(n - 1, Math.floor(t / params.segLen));
          if (t > totalTime()) { t = params.loop ? 0 : totalTime(); target = params.loop ? 0 : n - 1; }
          if (!ready(cur)) {
            buffering = true; // current batch not loaded yet: wait
          } else if (!ready(target)) {
            buffering = true; // next batch not loaded yet: hold at the end of this one
            params.time = Math.min(t, (cur + 1) * params.segLen - 0.001);
          } else {
            params.time = t;
          }
        }
        if (shown >= 0 && batches[shown]?.state === "ready") {
          // Time relative to the shown batch; clamped while the next batch is still loading.
          uTime.value = Math.max(0, Math.min(params.time - shown * params.segLen, params.segLen));
          const m = batches[shown].mesh;
          m.updateWorldMatrix(true, false);
          (renderer.xr.isPresenting ? renderer.xr.getCamera() : camera).getWorldPosition(camTmp);
          uCamLocal.value.copy(m.worldToLocal(camTmp));
          batches[shown].mesh.updateVersion(); // regenerate splats for the new time
        }
        const waiting = batches.find((b) => b && b.state === "loading");
        if (buffering) {
          const mb = (x) => (x / 1048576).toFixed(1);
          const idx = batches.findIndex((b) => b && b.state === "loading");
          bufEl.textContent = waiting
            ? `Buffering ${files[idx].name}  ${mb(waiting.got || 0)}${waiting.total ? " / " + mb(waiting.total) : ""} MB`
            : "Buffering...";
          bufEl.style.display = "block";
        } else {
          bufEl.style.display = "none";
        }
        if (now - lastStatus > 250) {
          const secs = lastStatus ? (now - lastStatus) / 1000 : 0.25;
          const fps = frames / secs, sps = sortsSeen / secs;
          frames = 0; sortsSeen = 0;
          lastStatus = now;
          const est = estimateActive();
          if (params.budgetOn && est) {
            // Raise the opacity threshold while too many splats are visible, lower it slowly otherwise.
            // Prefer Spark's real count of rendered splats; fall back to the estimate.
            const actual = spark.activeSplats > 0 ? spark.activeSplats : est.active;
            const r = actual / (params.budget * 1000);
            if (r > 1.05) params.minAlpha = Math.min(0.95, params.minAlpha * Math.min(2, 1 + (r - 1) * 0.5));
            else if (r < 0.8) params.minAlpha = Math.max(0.01, params.minAlpha / 1.1);
            uMinAlpha.value = params.minAlpha;
          }
          const loaded = batches.map((b, i) => (b ? `${i}:${b.state}` : null)).filter(Boolean).join(" ");
          statusEl.textContent =
            `${files.length} file(s), shown batch ${shown}\n` +
            `local t = ${uTime.value.toFixed(2)} / ${params.segLen}\n` +
            `fps ${fps.toFixed(0)} | sorts/s ${sps.toFixed(1)}\n` +
            (params.budgetOn ? `budget ${params.budget}k, threshold ${params.minAlpha.toFixed(3)}\n` : "") +
            `rendered by Spark: ${(spark.activeSplats / 1000).toFixed(0)}k\n` +
            (est && !params.sizeWeight ? `rough estimate (ignores size weighting) ~${(est.active / 1000).toFixed(0)}k of ${(est.n / 1000).toFixed(0)}k (${((100 * est.active) / est.n).toFixed(0)}%)\n` : "") +
            `batches: ${loaded}`;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>

</html>
