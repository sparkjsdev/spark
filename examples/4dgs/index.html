<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • 4D Gaussian Splats</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    #ui {
      position: absolute; left: 12px; top: 12px; z-index: 10; color: #fff;
      font: 13px/1.4 sans-serif; background: rgba(0, 0, 0, 0.55);
      padding: 8px 10px; border-radius: 6px; max-width: 360px;
    }
    #ui summary { cursor: pointer; opacity: 0.85; margin-top: 6px; }
    #message { margin-top: 4px; opacity: 0.9; }
    #status {
      margin-top: 4px; opacity: 0.85; white-space: pre-line;
      font-family: monospace; font-size: 11px;
    }
    #buffer {
      position: absolute; left: 50%; top: 45%; transform: translateX(-50%); z-index: 10; display: none;
      color: #fff; font: 16px/1.4 sans-serif; background: rgba(0, 0, 0, 0.65);
      padding: 10px 16px; border-radius: 8px;
    }
    #credit {
      position: absolute; left: 12px; bottom: 12px; z-index: 10; display: none;
      color: #fff; font: 13px/1.35 sans-serif; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }
    #credit .title { font-size: 16px; font-weight: 600; }
    #credit a { color: #fff; text-decoration: underline; }
  </style>
</head>

<body>
  <div id="buffer"></div>
  <div id="credit"></div>
  <div id="ui">
    <div>Select 4D compressed PLY files (<code>00.c.ply</code>, <code>01.c.ply</code>, ...):</div>
    <input type="file" id="file" accept=".ply" multiple />
    <div id="message">Loading the sample clip...</div>
    <details>
      <summary>Stats and network</summary>
      <div id="status"></div>
    </details>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "../js/vendor/three/build/three.module.js",
        "three/addons/": "../js/vendor/three/examples/jsm/",
        "lil-gui": "../js/vendor/lil-gui/dist/lil-gui.esm.js",
        "@sparkjsdev/spark": "../../dist/spark.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { VRButton } from "three/addons/webxr/VRButton.js";
    import { ARButton } from "three/addons/webxr/ARButton.js";
    import GUI from "lil-gui";
    import { SparkRenderer, SplatMesh, dyno } from "@sparkjsdev/spark";
    import { getAssetFileURL } from "../js/get-asset-url.js";

    // 4D Gaussian splats, FreeTimeGS style (https://zju3dv.github.io/freetimegs/).
    //
    // Every splat has a time center t0, a temporal scale sigma and a velocity v:
    //   center(t) = center + v * (t - t0)
    //   alpha(t)  = alpha * exp(-0.5 * ((t - t0) / sigma)^2)
    //
    // The files are SuperSplat "compressed PLY" files with two extra per-splat fields
    // (packed_motion, packed_time) and matching per-chunk min/max values. Spark already
    // decodes position, rotation, scale and color. This page decodes the two extra fields
    // into float textures and applies the formulas above on the GPU with a Dyno
    // objectModifier, so nothing is uploaded per frame, only the time changes.
    // See docs/docs/4dgs.md for the file layout and for how to create these files.
    //
    // A clip is a series of files (00.c.ply, 01.c.ply, ...) that each cover `segLen`
    // seconds. Only the current and the next file are kept in memory.
    //
    // URL options:
    //   ?url=a.c.ply             a single file
    //   ?base=./clip/&count=10   ./clip/00.c.ply ... ./clip/09.c.ply
    //   ?seglen=5                seconds per file (normally read from the file header)
    //   ?quality=low|medium|high quality of the sample clip (default: medium, low on a slow connection)
    //   ?budget=400              keep at most ~400k splats visible (raises the opacity threshold)
    //   ?size=0                  disable the size/distance weighting used by the budget
    //   ?xroffset=0,0,-1.5       where the clip first appears in AR/VR: x,y,z in meters relative to you
    //                            (z < 0 is in front of you, y is the height above the floor)
    //   ?vrscale=0.8             VR framebuffer scale (set before entering VR)
    //   ?foveation=1             fixed foveated rendering, 0..1

    const SPLAT_TEX_WIDTH = 2048;
    const SPLAT_TEX_HEIGHT = 2048;
    const CHUNK_SIZE = 256; // splats per compressed-PLY chunk

    // Shown bottom left while the sample clip is playing.
    const SAMPLE_CREDIT = {
      title: "Cat",
      text: "4D Gaussian splat clip from",
      name: "4DV.ai",
      href: "https://t.4dv.ai/viewer/cat",
    };

    // ---- Parse the extra 4D fields of a compressed PLY ----
    function parse4dPly(buf) {
      const bytes = new Uint8Array(buf);
      const tag = "end_header\n";
      const head = new TextDecoder("ascii").decode(bytes.subarray(0, Math.min(bytes.length, 16384)));
      const idx = head.indexOf(tag);
      if (idx < 0) throw new Error("PLY header not found");
      const hEnd = idx + tag.length;

      const elements = [];
      let segLen = 0;
      let fps = 0;
      for (const line of head.slice(0, hEnd).split("\n")) {
        const p = line.trim().split(/\s+/);
        if (p[0] === "comment" && p[1] === "fourd_seglen") segLen = Number(p[2]) || 0;
        if (p[0] === "comment" && p[1] === "fourd_fps") fps = Number(p[2]) || 0;
        if (p[0] === "element") elements.push({ name: p[1], count: Number(p[2]), props: {}, size: 0 });
        if (p[0] === "property") {
          const el = elements[elements.length - 1];
          el.props[p[2]] = el.size;
          el.size += 4; // float and uint32 only
        }
      }
      const chunkEl = elements.find((e) => e.name === "chunk");
      const vertEl = elements.find((e) => e.name === "vertex");
      if (!chunkEl || !vertEl || !("packed_motion" in vertEl.props) || !("packed_time" in vertEl.props)) {
        throw new Error("Not a 4D compressed PLY (missing chunk, packed_motion or packed_time)");
      }
      const dv = new DataView(buf);
      const chunkStart = hEnd;
      const vertStart = chunkStart + chunkEl.count * chunkEl.size;
      const keys = ["min_time", "max_time", "min_time_scale", "max_time_scale",
        "min_motion_x", "max_motion_x", "min_motion_y", "max_motion_y", "min_motion_z", "max_motion_z"];
      const chunks = new Array(chunkEl.count);
      for (let c = 0; c < chunkEl.count; c++) {
        const o = chunkStart + c * chunkEl.size;
        const ch = {};
        for (const k of keys) ch[k] = dv.getFloat32(o + chunkEl.props[k], true);
        chunks[c] = ch;
      }
      return {
        numSplats: vertEl.count, chunks, dv, vertStart, segLen, fps,
        recordSize: vertEl.size,
        motionOffset: vertEl.props.packed_motion,
        timeOffset: vertEl.props.packed_time,
      };
    }

    // Decode the 4D fields into two RGBA32F arrays that are laid out like Spark's splat textures.
    //   A = (vx, vy, vz, t0)    B = (ln sigma, 0, 0, 0)
    // packed_motion: 11-10-11 bits (x, y, z) between the chunk's min/max motion.
    // packed_time, layout 1 (the default): bits 31..21 ln(sigma) (11 bits), bits 20..11 time
    //                center (10 bits), both between the chunk's min/max; the low 11 bits are unused.
    // layout 0 swaps the two fields (kept for debugging files from other tools).
    function decode4d(info, layout, A, B) {
      const { numSplats, chunks, dv, vertStart, recordSize, motionOffset, timeOffset } = info;
      for (let i = 0; i < numSplats; i++) {
        const ch = chunks[Math.floor(i / CHUNK_SIZE)];
        const base = vertStart + i * recordSize;
        const m = dv.getUint32(base + motionOffset, true);
        const p = dv.getUint32(base + timeOffset, true);
        const fx = ((m >>> 21) & 2047) / 2047;
        const fy = ((m >>> 11) & 1023) / 1023;
        const fz = (m & 2047) / 2047;
        let ft, fs;
        if (layout === 0) {
          ft = (p >>> 21) / 2047;
          fs = ((p >>> 11) & 1023) / 1023;
        } else {
          fs = (p >>> 21) / 2047;
          ft = ((p >>> 11) & 1023) / 1023;
        }
        const o = i * 4;
        A[o] = ch.min_motion_x + fx * (ch.max_motion_x - ch.min_motion_x);
        A[o + 1] = ch.min_motion_y + fy * (ch.max_motion_y - ch.min_motion_y);
        A[o + 2] = ch.min_motion_z + fz * (ch.max_motion_z - ch.min_motion_z);
        A[o + 3] = ch.min_time + ft * (ch.max_time - ch.min_time);
        B[o] = ch.min_time_scale + fs * (ch.max_time_scale - ch.min_time_scale);
      }
    }

    // Percentiles of the decoded time centers and temporal scales (sampled). Logged to the
    // console for the first file, handy when checking a new file.
    function computeStats(info, A, B) {
      const step = Math.max(1, Math.floor(info.numSplats / 50000));
      const t0 = [], ls = [];
      for (let i = 0; i < info.numSplats; i += step) { t0.push(A[i * 4 + 3]); ls.push(B[i * 4]); }
      t0.sort((a, b) => a - b); ls.sort((a, b) => a - b);
      const q = (arr, f) => arr[Math.min(arr.length - 1, Math.floor(f * arr.length))];
      const pts = [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99];
      return { t0: pts.map((f) => q(t0, f)), lnSigma: pts.map((f) => q(ls, f)) };
    }

    // A float texture with the same layout as Spark's per-splat textures, so that
    // dyno.splatTexCoord(index) addresses it.
    function makeDataTexture(numSplats) {
      const width = SPLAT_TEX_WIDTH;
      const height = Math.max(1, Math.min(SPLAT_TEX_HEIGHT, Math.ceil(numSplats / width)));
      const depth = Math.ceil(numSplats / (width * height));
      const array = new Float32Array(width * height * depth * 4);
      const texture = new THREE.DataArrayTexture(array, width, height, depth);
      texture.format = THREE.RGBAFormat;
      texture.type = THREE.FloatType;
      texture.internalFormat = "RGBA32F";
      texture.minFilter = THREE.NearestFilter;
      texture.magFilter = THREE.NearestFilter;
      texture.needsUpdate = true;
      return { texture, array };
    }

    // ---- Scene ----
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(0, 1.4, 3.5);
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    // AR (walk around the clip in your own room) when the device supports it, otherwise VR.
    (async () => {
      let ar = false;
      try { ar = !!(await navigator.xr?.isSessionSupported("immersive-ar")); } catch { /* no WebXR */ }
      document.body.appendChild(ar ? ARButton.createButton(renderer, { optionalFeatures: ["local-floor"] }) : VRButton.createButton(renderer));
    })();
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.85, 0);
    controls.update();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const query = new URLSearchParams(location.search);

    // ---- Placement ----
    // All clip files live in `root`, so the whole clip can be moved. On desktop use the GUI
    // (Position). In AR/VR the clip first appears in front of you; point at the floor and
    // pull the trigger (or pinch / tap) to put it somewhere else.
    const root = new THREE.Group();
    scene.add(root);
    const place = { x: 0, z: 0, rotY: 0, scale: 1 };
    const applyDesktopPlacement = () => {
      root.position.set(place.x, 0, place.z);
      root.rotation.set(0, THREE.MathUtils.degToRad(place.rotY), 0);
      root.scale.setScalar(place.scale);
      controls.target.set(place.x, 0.85 * place.scale, place.z);
    };
    const xrOffset = (query.get("xroffset") || "0,0,-1.5").split(",").map(Number);
    let floorY = 0; // height of the floor in XR space
    let placePending = false;
    const camPos = new THREE.Vector3();
    const camDir = new THREE.Vector3();
    const aimPt = new THREE.Vector3();
    const tmpO = new THREE.Vector3();
    const tmpD = new THREE.Vector3();

    // The clip stands at (x, z) on the floor and faces you.
    function placeAt(x, z) {
      renderer.xr.getCamera().getWorldPosition(camPos);
      root.position.set(x, floorY, z);
      root.rotation.set(0, Math.atan2(camPos.x - x, camPos.z - z), 0);
      root.scale.setScalar(place.scale);
    }
    function placeInFront() {
      const cam = renderer.xr.getCamera();
      cam.getWorldPosition(camPos);
      cam.getWorldDirection(camDir);
      camDir.y = 0;
      if (camDir.lengthSq() < 1e-4) camDir.set(0, 0, -1);
      camDir.normalize();
      // 'local-floor' puts the floor at y = 0. With plain 'local' the origin is the head, so guess the floor.
      floorY = camPos.y < 0.5 ? camPos.y - 1.6 : 0;
      const [ox, oy, oz] = xrOffset;
      placeAt(camPos.x + camDir.x * -oz - camDir.z * ox, camPos.z + camDir.z * -oz + camDir.x * ox);
      root.position.y = floorY + oy;
    }
    // Where a controller (or hand, or screen tap) points on the floor.
    function aimAtFloor(c, out) {
      c.getWorldPosition(tmpO);
      tmpD.set(0, 0, -1).transformDirection(c.matrixWorld);
      if (tmpD.y > -0.05) return false;
      const t = (floorY - tmpO.y) / tmpD.y;
      if (t < 0 || t > 8) return false;
      out.copy(tmpO).addScaledVector(tmpD, t);
      return true;
    }
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.12, 0.15, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, depthTest: false }),
    );
    reticle.visible = false;
    scene.add(reticle);
    const controllers = [0, 1].map((i) => {
      const c = renderer.xr.getController(i);
      c.addEventListener("select", () => { if (aimAtFloor(c, aimPt)) placeAt(aimPt.x, aimPt.z); });
      scene.add(c);
      return c;
    });
    renderer.xr.addEventListener("sessionstart", () => { placePending = true; });
    renderer.xr.addEventListener("sessionend", () => {
      placePending = false;
      reticle.visible = false;
      floorY = 0;
      applyDesktopPlacement();
    });

    // ---- State ----
    const params = {
      time: 0, play: true, loop: true, speed: 1,
      segLen: Number(query.get("seglen")) || 5, // seconds covered by one file
      quality: "-",
      autoQuality: true, // drop to low quality when downloads are too slow
      minAlpha: 0.01, // splats whose opacity is below this are skipped
      budgetOn: query.has("budget"),
      budget: Number(query.get("budget")) || 200, // thousands of splats that may be visible
      sizeWeight: query.get("size") !== "0", // weigh the budget by apparent size
      layout: 1, scaleMode: 0, sigmaLog: 0, motionScale: 1, fade: true, flipY: false, debug: 0,
      vrScale: Number(query.get("vrscale")) || 1,
      foveation: query.has("foveation") ? Number(query.get("foveation")) : 1,
    };
    const segLenFromUrl = query.has("seglen");
    renderer.xr.setFramebufferScaleFactor(params.vrScale);
    renderer.xr.setFoveation(params.foveation);

    // Dyno uniforms, shared by all files; only the shown file is updated.
    const uTime = dyno.dynoFloat(0); // time relative to the start of the shown file
    const uMotionScale = dyno.dynoFloat(1);
    const uFade = dyno.dynoFloat(1);
    const uScaleMode = dyno.dynoInt(0);
    const uMinAlpha = dyno.dynoFloat(params.minAlpha);
    const uSigmaScale = dyno.dynoFloat(1);
    const uDebug = dyno.dynoInt(0);
    const uDbgLo = dyno.dynoFloat(0);
    const uDbgHi = dyno.dynoFloat(params.segLen);
    const uCamLocal = dyno.dynoVec3(new THREE.Vector3()); // camera position in the mesh's local space
    const uSizeWeight = dyno.dynoFloat(params.sizeWeight ? 1 : 0);

    const msgEl = document.getElementById("message");
    const statusEl = document.getElementById("status");
    const bufferEl = document.getElementById("buffer");
    const creditEl = document.getElementById("credit");
    let files = []; // sorted list of objects with a name and arrayBuffer()
    let batches = []; // per file: { state, mesh, texA, texB, info, arrays }
    let shown = -1; // index of the file that is visible
    let buffering = false; // true while playback waits for a download
    let qualityLists = {}; // quality name -> sorted list of files
    let qualityCtl = null;
    let slowNotice = ""; // shown after an automatic switch to low quality
    let clipFps = 0; // from the file header, if present
    const net = { bytes: 0, files: 0, cachedFiles: 0, last: null }; // download statistics of this session
    let timeCtl = null;
    const totalTime = () => Math.max(1, files.length) * params.segLen;

    function showCredit(c) {
      if (!c) { creditEl.style.display = "none"; return; }
      creditEl.textContent = "";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = c.title;
      const line = document.createElement("div");
      line.append(`${c.text} `);
      const a = document.createElement("a");
      a.href = c.href;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = c.name;
      line.append(a);
      creditEl.append(title, line);
      creditEl.style.display = "block";
    }

    // ---- Dyno: move and fade every splat for the current time ----
    function buildModifier(samplerA, samplerB) {
      return dyno.dynoBlock({ gsplat: dyno.Gsplat }, { gsplat: dyno.Gsplat }, ({ gsplat }) => {
        const { index } = dyno.splitGsplat(gsplat).outputs;
        const coord = dyno.splatTexCoord(index);
        const a = dyno.texelFetch(samplerA, coord); // (vx, vy, vz, t0)
        const b = dyno.texelFetch(samplerB, coord); // (ln sigma, ...)

        const motion = new dyno.Dyno({
          inTypes: {
            gsplat: dyno.Gsplat, a: "vec4", b: "vec4", t: "float",
            motionScale: "float", fade: "float", scaleMode: "int", minAlpha: "float", sigmaScale: "float",
            debug: "int", dbgLo: "float", dbgHi: "float", camPos: "vec3", sizeWeight: "float",
          },
          outTypes: { gsplat: dyno.Gsplat },
          statements: ({ inputs, outputs }) => dyno.unindentLines(/* glsl */ `
            ${outputs.gsplat} = ${inputs.gsplat};
            float lnS = ${inputs.b}.x;
            float sigma = (${inputs.scaleMode} == 0) ? exp(lnS)
                        : ((${inputs.scaleMode} == 1) ? lnS : exp(-lnS));
            sigma = max(sigma * ${inputs.sigmaScale}, 1e-4);
            float dt = ${inputs.t} - ${inputs.a}.w;
            if (${inputs.debug} == 1) {
              // Debug: color by decoded time center t0 (no filtering).
              float h = clamp((${inputs.a}.w - ${inputs.dbgLo}) / max(${inputs.dbgHi} - ${inputs.dbgLo}, 1e-4), 0.0, 1.0) * 0.8;
              ${outputs.gsplat}.rgba.rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            } else if (${inputs.debug} == 2) {
              // Debug: color by decoded ln(sigma) (no filtering).
              float h = clamp((lnS + 5.0) / 8.0, 0.0, 1.0) * 0.8;
              ${outputs.gsplat}.rgba.rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            } else if (${inputs.debug} == 0) {
              ${outputs.gsplat}.center += ${inputs.a}.xyz * dt * ${inputs.motionScale};
              float w = exp(-0.5 * (dt * dt) / (sigma * sigma));
              float alpha = ${inputs.gsplat}.rgba.a * mix(1.0, w, ${inputs.fade});
              ${outputs.gsplat}.rgba.a = alpha;
              // Importance = opacity, optionally scaled by apparent size (size / distance).
              // Small or far-away splats are dropped first when the budget is tight.
              float sz = max(max(${inputs.gsplat}.scales.x, ${inputs.gsplat}.scales.y), ${inputs.gsplat}.scales.z);
              float dist = max(distance(${outputs.gsplat}.center, ${inputs.camPos}), 0.05);
              float sizeF = clamp((sz / dist) / 0.003, 0.0, 1.0);
              float importance = alpha * mix(1.0, sizeF, ${inputs.sizeWeight});
              if (importance < ${inputs.minAlpha}) {
                ${outputs.gsplat}.flags = 0u;
              }
            }
            // debug == 3: pass-through, exactly what plain Spark shows.
          `),
        });
        return {
          gsplat: motion.apply({
            gsplat, a, b, t: uTime, motionScale: uMotionScale,
            fade: uFade, scaleMode: uScaleMode, minAlpha: uMinAlpha, sigmaScale: uSigmaScale,
            debug: uDebug, dbgLo: uDbgLo, dbgHi: uDbgHi, camPos: uCamLocal, sizeWeight: uSizeWeight,
          }).gsplat,
        };
      });
    }

    const setFlip = (m) => m.quaternion.set(params.flipY ? 1 : 0, 0, 0, params.flipY ? 0 : 1);
    const refreshGui = () => gui.controllersRecursive().forEach((c) => c.updateDisplay());

    // ---- Download with progress and retries, kept in the Cache Storage ----
    // Finished downloads are stored explicitly (the normal HTTP cache has a size limit per file),
    // so later loops and page reloads don't download them again. Clear them in
    // DevTools > Application > Cache storage.
    const CACHE_NAME = "spark-4dgs-files";
    function remoteFile(url) {
      return {
        name: url.split("/").pop(),
        arrayBuffer: async (onProgress, onInfo) => {
          const t0 = performance.now();
          try {
            if ("caches" in window) {
              const hit = await (await caches.open(CACHE_NAME)).match(url);
              if (hit) {
                const cached = await hit.arrayBuffer();
                onProgress?.(cached.byteLength, cached.byteLength);
                onInfo?.({ bytes: cached.byteLength, ms: 0, cached: true });
                return cached;
              }
            }
          } catch (err) { console.warn("Cache read failed", err); }
          let lastError;
          for (let attempt = 0; attempt < 4; attempt++) {
            try {
              const res = await fetch(url);
              if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
              const total = Number(res.headers.get("content-length")) || 0; // 0 if hidden by CORS
              const reader = res.body.getReader();
              const parts = [];
              let got = 0;
              for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                parts.push(value);
                got += value.length;
                onProgress?.(got, total);
              }
              const out = new Uint8Array(got);
              let offset = 0;
              for (const part of parts) { out.set(part, offset); offset += part.length; }
              if ("caches" in window) {
                // Not awaited, so playback is not delayed. May fail when the storage quota is exceeded.
                caches.open(CACHE_NAME).then((c) => c.put(url, new Response(out))).catch(() => {});
              }
              onInfo?.({ bytes: got, ms: performance.now() - t0, cached: false });
              return out.buffer;
            } catch (err) {
              lastError = err;
              await new Promise((r) => setTimeout(r, 1000 * 2 ** attempt));
            }
          }
          throw lastError;
        },
      };
    }

    // ---- Loading and unloading files ----
    async function loadBatch(i) {
      const batch = (batches[i] = { state: "loading" });
      try {
        const file = files[i];
        const buf = await file.arrayBuffer(
          (got, total) => { batch.got = got; batch.total = total; },
          (info) => {
            batch.net = info;
            net.last = { name: file.name, ...info };
            if (info.cached) net.cachedFiles++;
            else { net.bytes += info.bytes; net.files++; }
            checkSlowDownload(info);
          },
        );
        if (batches[i] !== batch) return; // files or quality changed while downloading
        const info = parse4dPly(buf);
        if (i === 0) {
          if (info.fps) clipFps = info.fps;
          if (info.segLen && !segLenFromUrl) {
            params.segLen = info.segLen; // the converter script writes the file length into the header
            timeCtl?.max(totalTime());
            refreshGui();
          }
        }
        const A = makeDataTexture(info.numSplats);
        const B = makeDataTexture(info.numSplats);
        decode4d(info, params.layout, A.array, B.array);
        A.texture.needsUpdate = true;
        B.texture.needsUpdate = true;
        // The same keys for every file, so the shader is compiled only once.
        const samplerA = new dyno.DynoSampler2DArray({ value: A.texture, key: "fourDMotionTime" });
        const samplerB = new dyno.DynoSampler2DArray({ value: B.texture, key: "fourDTimeScale" });

        // Spark may transfer the buffer to a worker, so give it its own copy.
        const mesh = new SplatMesh({ fileBytes: buf.slice(0), fileName: file.name });
        mesh.objectModifier = buildModifier(samplerA, samplerB);
        mesh.visible = false;
        setFlip(mesh);
        root.add(mesh);
        await mesh.initialized;
        if (batches[i] !== batch) { // discarded while loading
          root.remove(mesh);
          mesh.dispose?.();
          A.texture.dispose();
          B.texture.dispose();
          return;
        }
        mesh.updateGenerator();
        Object.assign(batch, { mesh, texA: A.texture, texB: B.texture, arrays: { A: A.array, B: B.array }, info, state: "ready" });
        if (i === 0) console.log("4D splats, decoded stats of file 0", computeStats(info, A.array, B.array));
        msgEl.textContent = slowNotice;
      } catch (err) {
        batch.state = "error";
        batch.failedAt = performance.now();
        console.error(err);
        msgEl.textContent = `Error in ${files[i]?.name}: ${err.message}`;
      }
    }

    // A file that needs longer to download than it plays means the connection is too slow for this quality.
    function checkSlowDownload(info) {
      if (info.cached || !params.autoQuality || params.quality === "low" || !qualityLists.low) return;
      if (info.ms > (params.segLen * 1000 * 0.8) / Math.max(params.speed, 0.1)) {
        params.quality = "low";
        slowNotice = "Slow connection: switched to low quality.";
        msgEl.textContent = slowNotice;
        refreshGui();
        switchQuality("low");
      }
    }

    function unloadBatch(i) {
      const batch = batches[i];
      if (!batch || batch.state !== "ready") return;
      root.remove(batch.mesh);
      batch.mesh.dispose?.();
      batch.texA.dispose();
      batch.texB.dispose();
      batches[i] = undefined;
    }

    // Keeps the file for the current time and the next one loaded, drops the rest.
    function manageBatches() {
      const n = files.length;
      if (n === 0) return;
      const cur = Math.min(n - 1, Math.max(0, Math.floor(params.time / params.segLen)));
      const next = cur + 1 < n ? cur + 1 : (params.loop ? 0 : -1);
      const want = new Set([cur]);
      // Fetch the next file only after the current one is ready, so they don't compete for bandwidth.
      if (next >= 0 && next !== cur && batches[cur]?.state === "ready") want.add(next);
      for (const i of want) {
        if (batches[i]?.state === "error" && performance.now() - batches[i].failedAt > 3000) batches[i] = undefined; // retry
        if (!batches[i]) loadBatch(i);
      }
      for (let i = 0; i < n; i++) if (!want.has(i) && i !== shown) unloadBatch(i);
      // Switch as soon as the file for the current time is ready; until then keep the old one.
      if (batches[cur]?.state === "ready" && shown !== cur) {
        const old = shown;
        if (old >= 0 && batches[old]?.mesh) batches[old].mesh.visible = false;
        batches[cur].mesh.visible = true;
        shown = cur;
        uDbgHi.value = params.segLen;
        if (old >= 0 && old !== cur && !want.has(old)) unloadBatch(old);
      }
    }

    function redecodeAll() {
      for (const b of batches) {
        if (!b || b.state !== "ready") continue;
        decode4d(b.info, params.layout, b.arrays.A, b.arrays.B);
        b.texA.needsUpdate = true;
        b.texB.needsUpdate = true;
        b.mesh.updateVersion();
      }
    }

    function setFiles(list) {
      for (let i = 0; i < batches.length; i++) unloadBatch(i);
      batches = [];
      shown = -1;
      files = [...list].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      params.time = 0;
      timeCtl?.max(totalTime());
      refreshGui();
    }

    // Switches to another set of files (same clip, other quality). The shown file keeps playing;
    // the following files are fetched in the new quality.
    function switchQuality(q) {
      if (!qualityLists[q]) return;
      files = qualityLists[q];
      for (let i = 0; i < batches.length; i++) {
        if (i === shown) continue;
        if (batches[i]?.state === "ready") unloadBatch(i);
        else batches[i] = undefined; // in-flight loads are dropped when they finish
      }
    }
    function setQualityLists(lists, initial) {
      qualityLists = lists;
      params.quality = initial;
      const names = ["low", "medium", "high", "default", "local"].filter((n) => lists[n]);
      slowNotice = "";
      qualityCtl?.destroy();
      autoQualityCtl.hide();
      qualityCtl = null;
      if (names.length > 1) {
        qualityCtl = gui.add(params, "quality", names).name("quality").onChange((q) => {
          params.autoQuality = false; // the user chose: stop switching automatically
          refreshGui();
          switchQuality(q);
        });
        speedCtl.domElement.after(qualityCtl.domElement); // right under "speed"
        qualityCtl.domElement.after(autoQualityCtl.domElement);
        autoQualityCtl.show();
      }
      setFiles(lists[initial]);
    }

    // ---- GUI (the advanced parts are folded) ----
    const gui = new GUI({ title: "4D splats" });
    timeCtl = gui.add(params, "time", 0, 5, 0.001).name("time (s)").listen();
    gui.add(params, "play");
    gui.add(params, "loop");
    const speedCtl = gui.add(params, "speed", 0, 4, 0.01);
    // "quality" is added under speed by setQualityLists, only when the clip comes in several qualities.
    const autoQualityCtl = gui.add(params, "autoQuality").name("auto quality (slow wifi)");
    autoQualityCtl.hide();

    const pos = gui.addFolder("Position (desktop)");
    pos.add(place, "x", -5, 5, 0.01).onChange(applyDesktopPlacement);
    pos.add(place, "z", -5, 5, 0.01).onChange(applyDesktopPlacement);
    pos.add(place, "rotY", -180, 180, 1).name("rotation").onChange(applyDesktopPlacement);
    pos.add(place, "scale", 0.1, 3, 0.01).onChange(applyDesktopPlacement);
    pos.close();

    const perf = gui.addFolder("Performance");
    perf.add(params, "minAlpha", 0, 1, 0.001).name("min opacity").listen().onChange((v) => { uMinAlpha.value = v; });
    perf.add(params, "budgetOn").name("auto budget");
    perf.add(params, "budget", 20, 1500, 10).name("budget (k splats)");
    perf.add(params, "sizeWeight").name("weigh by size/distance").onChange((v) => { uSizeWeight.value = v ? 1 : 0; });
    perf.close();

    const adv = gui.addFolder("Advanced");
    adv.add(params, "segLen", 0.05, 20, 0.01).name("seconds per file").onChange(() => { timeCtl.max(totalTime()); refreshGui(); });
    adv.add(params, "motionScale", 0, 5, 0.01).name("motion scale").onChange((v) => { uMotionScale.value = v; });
    adv.add(params, "fade").name("temporal opacity").onChange((v) => { uFade.value = v ? 1 : 0; });
    adv.add(params, "flipY").name("flip upside down").onChange(() => {
      for (const b of batches) if (b?.mesh) setFlip(b.mesh);
    });
    adv.close();

    const dbg = gui.addFolder("Debug");
    dbg.add(params, "layout", { "scale=hi11, time=mid10 (default)": 1, "time=hi11, scale=mid10": 0 })
      .name("packed_time layout").onChange(redecodeAll);
    dbg.add(params, "scaleMode", { "sigma = exp(scale)": 0, "sigma = raw scale": 1, "sigma = exp(-scale)": 2 })
      .name("temporal scale").onChange((v) => { uScaleMode.value = Number(v); });
    dbg.add(params, "sigmaLog", -2, 2, 0.01).name("sigma scale (10^x)").onChange((v) => { uSigmaScale.value = 10 ** v; });
    dbg.add(params, "debug", {
      "off (normal playback)": 0, "color by time t0": 1,
      "color by temporal scale": 2, "no effect (plain Spark)": 3,
    }).name("view").onChange((v) => { uDebug.value = Number(v); });
    dbg.close();

    // ---- Input ----
    document.getElementById("file").addEventListener("change", (e) => {
      if (!e.target.files.length) return;
      showCredit(null);
      setQualityLists({ local: [...e.target.files] }, "local");
    });
    const pad = (i) => String(i).padStart(2, "0");
    if (query.get("url")) {
      setQualityLists({ local: [remoteFile(query.get("url"))] }, "local");
    } else if (query.get("base")) {
      const count = Number(query.get("count") || 10);
      setQualityLists({ local: Array.from({ length: count }, (_, i) => remoteFile(`${query.get("base")}${pad(i)}.c.ply`)) }, "local");
    } else {
      loadSample();
    }

    // No URL options: load the sample clip listed in examples/assets.json, in several qualities:
    // cat-low-00.c.ply ... cat-low-09.c.ply, cat-medium-00.c.ply ... (4dgs-sample-* names also work).
    async function loadSample() {
      try {
        const assets = await (await fetch("../assets.json")).json();
        const groups = {};
        for (const key of Object.keys(assets)) {
          const m = /^(?:cat|4dgs-sample)-(?:(low|medium|high)-)?(\d+)\.c\.ply$/.exec(key);
          if (m) (groups[m[1] || "default"] ||= []).push(key);
        }
        const lists = {};
        for (const [q, keys] of Object.entries(groups)) {
          keys.sort();
          lists[q] = (await Promise.all(keys.map((k) => getAssetFileURL(k)))).map(remoteFile);
        }
        const wanted = query.get("quality");
        // Default: medium, or low when the browser reports a slow or data-saving connection.
        const conn = navigator.connection;
        const slow = conn && (conn.saveData || /^(slow-2g|2g|3g)$/.test(conn.effectiveType || "") || (conn.downlink && conn.downlink < 5));
        const initial = lists[wanted] ? wanted
          : slow && lists.low ? "low"
          : lists.medium ? "medium" : lists.default ? "default" : lists.low ? "low" : Object.keys(lists)[0];
        if (!initial) throw new Error("no cat-<quality>-NN.c.ply entries in assets.json");
        if (lists[wanted]) params.autoQuality = false; // ?quality= is an explicit choice
        setQualityLists(lists, initial);
        showCredit(SAMPLE_CREDIT);
      } catch (err) {
        msgEl.textContent = `No sample clip (${err.message}). Select files above or use ?base=...`;
      }
    }

    // ---- Render loop ----
    let last = performance.now();
    let lastStatus = 0;
    let frames = 0;
    let sortsSeen = 0;
    let lastSortStamp = 0;
    const camTmp = new THREE.Vector3();

    // Estimates how many splats are visible at the current time (sampled, so it is cheap).
    function estimateActive() {
      const b = batches[shown];
      if (!b || b.state !== "ready") return null;
      const A = b.arrays.A, B = b.arrays.B, n = b.info.numSplats;
      const stride = 8, t = uTime.value, k = 10 ** params.sigmaLog;
      let c = 0, total = 0;
      for (let i = 0; i < n; i += stride) {
        const sigma = Math.max(Math.exp(B[i * 4]) * k, 1e-4);
        const x = (t - A[i * 4 + 3]) / sigma;
        if (Math.exp(-0.5 * x * x) >= params.minAlpha) c++;
        total++;
      }
      return { active: Math.round((c / total) * n), n };
    }

    renderer.setAnimationLoop((now) => {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      frames++;
      if (renderer.xr.isPresenting) {
        if (placePending) { placeInFront(); placePending = false; }
        const hit = controllers.some((c) => aimAtFloor(c, aimPt));
        reticle.visible = hit;
        if (hit) reticle.position.set(aimPt.x, floorY + 0.01, aimPt.z);
      }
      if (spark.lastSortTime !== lastSortStamp) { lastSortStamp = spark.lastSortTime; sortsSeen++; }
      if (files.length) {
        manageBatches();
        buffering = false;
        if (params.play) {
          // The clock only runs while the data for the current time is loaded.
          const n = files.length;
          const ready = (i) => batches[i]?.state === "ready";
          const cur = Math.min(n - 1, Math.max(0, Math.floor(params.time / params.segLen)));
          let t = params.time + dt * params.speed;
          let target = Math.min(n - 1, Math.floor(t / params.segLen));
          if (t > totalTime()) { t = params.loop ? 0 : totalTime(); target = params.loop ? 0 : n - 1; }
          if (!ready(cur)) {
            buffering = true; // the current file is not loaded yet: wait
          } else if (!ready(target)) {
            buffering = true; // the next file is not loaded yet: hold at the end of this one
            params.time = Math.min(t, (cur + 1) * params.segLen - 0.001);
          } else {
            params.time = t;
          }
        }
        if (shown >= 0 && batches[shown]?.state === "ready") {
          // Time relative to the shown file; clamped while the next file is still loading.
          uTime.value = Math.max(0, Math.min(params.time - shown * params.segLen, params.segLen));
          const m = batches[shown].mesh;
          m.updateWorldMatrix(true, false);
          (renderer.xr.isPresenting ? renderer.xr.getCamera() : camera).getWorldPosition(camTmp);
          uCamLocal.value.copy(m.worldToLocal(camTmp));
          m.updateVersion(); // regenerate the splats for the new time
        }
        if (buffering) {
          const mb = (x) => (x / 1048576).toFixed(1);
          const idx = batches.findIndex((b) => b && b.state === "loading");
          const loading = idx >= 0 ? batches[idx] : null;
          bufferEl.textContent = loading
            ? `Buffering ${files[idx].name}... ${mb(loading.got || 0)}${loading.total ? ` / ${mb(loading.total)}` : ""} MB`
            : "Buffering...";
          bufferEl.style.display = "block";
        } else {
          bufferEl.style.display = "none";
        }
        if (now - lastStatus > 250) {
          const secs = lastStatus ? (now - lastStatus) / 1000 : 0.25;
          const fps = frames / secs, sps = sortsSeen / secs;
          frames = 0; sortsSeen = 0;
          lastStatus = now;
          const est = estimateActive();
          if (params.budgetOn && est) {
            // Raise the opacity threshold while too many splats are visible, lower it slowly otherwise.
            // Uses Spark's real count of rendered splats, with the sampled estimate as a fallback.
            const actual = spark.activeSplats > 0 ? spark.activeSplats : est.active;
            const r = actual / (params.budget * 1000);
            if (r > 1.05) params.minAlpha = Math.min(0.95, params.minAlpha * Math.min(2, 1 + (r - 1) * 0.5));
            else if (r < 0.8) params.minAlpha = Math.max(0.01, params.minAlpha / 1.1);
            uMinAlpha.value = params.minAlpha;
          }
          const mb = (x) => (x / 1e6).toFixed(1);
          const sb = batches[shown];
          let fileInfo = "";
          if (sb?.net) {
            const perSec = sb.net.bytes / (params.segLen / Math.max(params.speed, 1e-6));
            fileInfo = `this file: ${mb(sb.net.bytes)} MB, ${(sb.info.numSplats / 1e6).toFixed(2)}M splats\n` +
              `stream rate: ${mb(perSec)} MB/s = ${((perSec * 8) / 1e6).toFixed(0)} Mbit/s at speed x${params.speed}\n`;
          }
          let lastInfo = "";
          if (net.last) {
            lastInfo = net.last.cached
              ? `last download: ${net.last.name} from local cache\n`
              : `last download: ${net.last.name} ${mb(net.last.bytes)} MB in ${(net.last.ms / 1000).toFixed(1)} s = ${((net.last.bytes * 8) / 1e6 / (net.last.ms / 1000)).toFixed(0)} Mbit/s\n`;
          }
          const loaded = batches.map((b, i) => (b ? `${i}:${b.state}` : null)).filter(Boolean).join(" ");
          statusEl.textContent =
            `quality: ${params.quality}, ${files.length} file(s), shown file ${shown + 1}\n` +
            `${params.segLen.toFixed(2)} s per file${clipFps ? `, ${clipFps} fps source` : ""}, local t = ${uTime.value.toFixed(2)}\n` +
            fileInfo + lastInfo +
            `session: ${mb(net.bytes)} MB downloaded in ${net.files} files, ${net.cachedFiles} from cache\n` +
            `fps ${fps.toFixed(0)} | sorts/s ${sps.toFixed(1)}\n` +
            (params.budgetOn ? `budget ${params.budget}k, opacity threshold ${params.minAlpha.toFixed(3)}\n` : "") +
            `drawn by Spark: ${(spark.activeSplats / 1000).toFixed(0)}k\n` +
            (est && !params.sizeWeight ? `estimate ~${(est.active / 1000).toFixed(0)}k of ${(est.n / 1000).toFixed(0)}k (${((100 * est.active) / est.n).toFixed(0)}%)\n` : "") +
            `files: ${loaded}`;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>

</html>
